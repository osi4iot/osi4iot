apiVersion: 1

datasources:
  - name: timescaledb_org_1
    type: postgres
    access: proxy
    url: ${TIMESCALE_HOST}:${TIMESCALE_PORT}
    database: $TIMESCALE_DB
    orgId: 1
    isDefault: true
    user: data_source_user_org_1
    secureJsonData:
      password: ${GRAFANA_DATASOURCE_PASSWORD}
    jsonData:
      sslmode: "disable"
      maxOpenConns: 0
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 903
      timescaledb: true