;managed_identity_client_id =

#################################### SMTP / Emailing ##########################
[smtp]
enabled = true
host = smtp.gmail.com:465
user = ${NOTIFICATIONS_EMAIL_USER}
password = ${NOTIFICATIONS_EMAIL_PASSWORD}
from_address = ${NOTIFICATIONS_EMAIL_ADDRESS}
from_name = "IOT ${MAIN_ORGANIZATION_ACRONYM} Platform alert"
;ehlo_identity = dashboard.example.com
;startTLS_policy = NoStartTLS

[emails]
;welcome_email_on_sign_up = false
;templates_pattern = emails/*.html, emails/*.txt
;content_types = text/html

#################################### Logging ##########################
[log]
;mode = console file
;level = info
;filters =

[log.console]
;level =
;format = console

[log.file]
;level =
;format = text
;log_rotate = true
;max_lines = 1000000
;max_size_shift = 28
;daily_rotate = true
;max_days = 7

[log.syslog]
;level =
;format = text
;network =
;address =
;facility =
;tag =

[log.frontend]
;enabled = false
;sentry_dsn =
;custom_endpoint = /log
;sample_rate = 1.0
;log_endpoint_requests_per_second_limit = 3
;log_endpoint_burst_limit = 15

#################################### Usage Quotas ########################
[quota]
; enabled = false
; org_user = 10
; org_dashboard = 100
; org_data_source = 10
; org_api_key = 10
;org_alert_rule = 100
; user_org = 10
; global_user = -1
; global_org = -1
; global_dashboard = -1
; global_api_key = -1
; global_session = -1
;global_alert_rule = -1

#################################### Unified Alerting (12.x) #############
[unified_alerting]
enabled = true
;disabled_orgs =
;admin_config_poll_interval = 60s
;alertmanager_config_poll_interval = 60s
;ha_listen_address = "0.0.0.0:9094"
;ha_advertise_address = ""
;ha_peers = ""
;ha_peer_timeout = "15s"
;ha_gossip_interval = "200ms"
;ha_push_pull_interval = "60s"
;execute_alerts = true
;evaluation_timeout = 30s
;max_attempts = 3
;min_interval = 10s

#################################### Legacy Alerting (disabled) ##########
[alerting]
enabled = false
;execute_alerts = true
;error_or_timeout = alerting
;nodata_or_nullvalues = no_data
;concurrent_render_limit = 5
;evaluation_timeout_seconds = 30
;notification_timeout_seconds = 30
;max_attempts = 3
;min_interval_seconds = 1

