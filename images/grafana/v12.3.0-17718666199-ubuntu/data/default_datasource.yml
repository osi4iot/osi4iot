apiVersion: 1

datasources:
  - name: timescaledb_org_1
    uid: TSDB_ORG_1                # Stable UID to prevent duplicates on re-provision
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: ${TIMESCALE_DB}
    orgId: 1
    isDefault: true
    editable: false
    user: data_source_user_org_1
    secureJsonData:
      password: ${GRAFANA_DATASOURCE_PASSWORD}
    jsonData:
      sslmode: "disable"
      postgresVersion: ${POSTGRES_VERSION:1200}
      timescaledb: true
      maxOpenConns: 0
      maxIdleConns: 2
      connMaxLifetime: 14400