nodes:
    - nodeUid: "node1"
      type: "Listen"
      numOuputs: 1
      x: 0.0
      y: 0.0
      settings: 
        subject: "test.input"
      wires: [[{"nodeUid": "node2", "wireUid": "wire1"}]]
    - nodeUid: "node2"
      type: "Function"
      numOuputs: 1
      x: 0.0
      y: 0.0
      settings:
        script: |
            function process(message) {
              message.payload.data = {
                message: "<h1>⚠️ Hola soy Sofia!</h1>",
                subject: "Alert: High Temperature",
              };
              return message;
            }
      wires: [[{"nodeUid": "node3", "wireUid": "wire2"}]]
    - nodeUid: "node3"
      type: "Publish"
      numOuputs: 0
      x: 0.0
      y: 0.0      
      metadata:
        subject: "test.output"
      wires: []